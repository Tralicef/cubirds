        <dt>Determinización</dt><dd>Junta las cartas que no ve (las manos rivales, el mazo y el descarte) y en cada simulación las reparte al azar, respetando cuántas tiene cada uno.</dd>
        <dt>Modelo de rivales</dt><dd>En la simulación todos juegan como Afinado durante una vuelta de mesa. Después evalúa cómo quedó: bandadas que le faltan, valor de su mano y pájaros, menos el mejor rival.</dd>
        <dt>Experto (rollouts planos)</dt><dd>Toma las 6 mejores jugadas según Afinado y le da 8 simulaciones a cada una.</dd>
        <dt>ISMCTS</dt><dd>Usa UCB (lección 3) para mandar más simulaciones a las jugadas que vienen saliendo bien, y arma un árbol con sus jugadas siguientes.</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Una jugada pensada paso a paso</h2>
      <div id="l11"></div>
      <div class="controls"><button class="btn secondary" type="button" id="l11new">Otra situación</button></div>
    </div>
    <div class="card">
      <h2>En pseudocódigo (ISMCTS de una jugada)</h2>
      <div class="code">candidatas = las 8 mejores jugadas según Afinado
repetir N veces:
    repartir las cartas ocultas al azar (determinización)
    a = la candidata sin probar, o argmax  valor(a) + c·√(ln N / N(a))   # UCB
    jugar a y una vuelta de mesa con todos como Afinado
    sumar la evaluación a la candidata a
jugar la candidata con más simulaciones</div>
    </div>
    <div class="card">
      <h2>Lo bueno y lo que le falta</h2>
      <div class="pros">
        <div><h3>Lo bueno</h3><ul><li>No necesita entrenamiento: anda desde la primera partida.</li><li>Se adapta a cualquier situación, aunque sea rara.</li><li>Más tiempo para pensar es más fuerza: el ISMCTS queda entre los primeros del ranking.</li></ul></div>
        <div><h3>Lo que le falta</h3><ul><li>Es lento: cientos de simulaciones por jugada.</li><li>Depende de su evaluación y de su modelo de rivales: el Experto, con la misma idea pero sin UCB, apenas le gana a Afinado.</li><li>No aprende: comete el mismo error cada vez.</li></ul></div>
      </div>
      <div class="elos" data-elos="ismcts,experto,afinado"></div>
    </div>
    <div class="next">
      <a class="btn secondary" href="lab.html#ismcts">Verlo pensar en el Laboratorio</a>
      <button class="btn" type="button" data-go="13">Lección 13: AlphaZero →</button>
    </div>`;
  function show() {
    const ep = situation(71), g = ep.g, rng = seed(73), hand = ep.hand();
    const hidden = g.deck.length + g.discard.length + sum(g.hands.slice(1).map(sum));
    const sim = E.determinize(g, 0, rng);
    const cands = E.ranked(g, g.legalActions(), E.AFINADO);
    const ro = narrateRollout(E.determinize(g, 0, rng), 0, cands[0], rng);
    const { best, snaps } = rootSearch(g, 120, rng, [10, 40, 120]);
    const snapTable = sn => `<div class="scroll"><table class="dec"><thead><tr><th>Jugada</th><th>Sim.</th><th>Valor</th></tr></thead><tbody>${sn.rows.slice().sort((a, b) => b[1] - a[1]).slice(0, 5).map(([a, n, m]) => `<tr><td>${actHTML(a, hand)}</td><td class="num">${n}</td><td class="num">${m == null ? '—' : fmt(m, 3)}</td></tr>`).join('')}</tbody></table></div>`;
    $('l11').innerHTML = `
      <div class="step"><h3><em>1</em> Mira la mesa, su mano y las colecciones <span class="tag">piensa</span></h3>${situationHTML(ep)}</div>
      <div class="step"><h3><em>2</em> Cuenta las cartas que no ve <span class="tag">piensa</span></h3><p>Hay <b>${hidden}</b> cartas ocultas: las manos de los rivales (${g.hands.slice(1).map(sum).join(', ')} cartas), el mazo (${g.deck.length}) y el descarte (${g.discard.length}).</p></div>
      <div class="step"><h3><em>3</em> Imagina qué tienen los rivales (una determinización) <span class="tag">piensa</span></h3>
        ${sim.hands.slice(1).map((h, i) => countsView(h, `${NAMES[i + 1]} (imaginado)`)).join('')}</div>
      <div class="step"><h3><em>4</em> Simula una vuelta de mesa <span class="tag">piensa</span></h3><p>Prueba ${actHTML(cands[0], hand)} y deja que todos jueguen como Afinado hasta que le vuelva a tocar:</p>
        ${eventsList({ events: ro.events })}
        <div class="calc">evaluación = suya − ${fmt(E.EXPERTO_W.opp)} × mejor rival = ${fmt(ro.mine, 2)} − ${fmt(E.EXPERTO_W.opp)} × ${fmt(ro.opp, 2)} → valor <b>${fmt(ro.v, 3)}</b></div>
        <p>Es un solo futuro posible: hace falta repetirlo muchas veces, con manos imaginadas distintas.</p></div>
      <div class="step"><h3><em>5</em> Repite y reparte con UCB <span class="tag">piensa</span></h3><p>Así quedó el reparto entre las 8 candidatas a las 10, 40 y 120 simulaciones:</p>
        <div class="pros" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${snaps.map(sn => `<div><h3>${sn.it} simulaciones</h3>${snapTable(sn)}</div>`).join('')}</div></div>
      <div class="step cur"><h3><em>6</em> Elige <span class="tag">piensa</span></h3><p>Hace la más simulada: ${actHTML(best, hand)}. ${best === cands[0] ? 'Coincide con la favorita de Afinado.' : 'No es la favorita de Afinado: la búsqueda encontró algo mejor (o tuvo suerte con las manos imaginadas).'}</p></div>
      <div class="step"><h3><em>7</em> ¿Y el aprendizaje? <span class="tag">aprende</span></h3><p>No hay. En la jugada siguiente empieza de cero.</p></div>`;
  }
  $('l11new').addEventListener('click', () => { $('l11').innerHTML = '<p class="muted">Pensando…</p>'; setTimeout(show, 20); });
  setTimeout(show, 20);
}

// ===================== Lección 13: AlphaZero =====================
function lesson12(root) {
  root.innerHTML = `
    <div><div class="eyebrow">Lección 13 · Anthony y otros, 2017 · Silver y otros, 2017</div><h1>Expert Iteration y AlphaZero: pensar y aprender juntos</h1></div>
    <p class="idea">Una red aprende a jugar imitando a una búsqueda, y la búsqueda piensa mejor usando a la red. Cada una mejora a la otra, vuelta tras vuelta.</p>
    <div class="card">
      <h2>Juntar las dos mitades</h2>
      <p>La búsqueda (lección 12) piensa bien pero no aprende, y su evaluación es fija. Las redes (lecciones 8 a 10) aprenden pero no piensan en la jugada. <b>Expert Iteration</b> las combina: la búsqueda (el experto) juega y anota cómo repartió sus simulaciones; la red (el aprendiz) aprende a predecir ese reparto; y en la vuelta siguiente el experto usa al aprendiz. <b>AlphaZero</b> es la versión más conocida: la red da las dos cosas que la búsqueda necesitaba de afuera.</p>
      <dl class="gloss">
        <dt>Política (priors)</dt><dd>Qué jugadas parecen buenas: la búsqueda prueba primero esas (PUCT, una variante de UCB que reparte según la red).</dd>
        <dt>Valor</dt><dd>Qué tan bien está cada jugador: al llegar a una posición nueva, la red la evalúa en vez de simular con Afinado.</dd>
        <dt>Autojuego</dt><dd>Todos los asientos buscan con la misma red. La política aprende las visitas de la búsqueda; el valor, quién ganó.</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Lo que hubo que adaptar a CuBirds</h2>
      <dl class="gloss">
        <dt>Cartas ocultas</dt><dd>En cada simulación se reparten manos posibles (como en ISMCTS), y cada nodo cuenta cuántas veces estuvo disponible cada jugada.</dd>
        <dt>Varios jugadores</dt><dd>Cada nodo guarda la probabilidad de ganar de <b>cada</b> jugador; el que juega elige según la suya (max^n).</dd>
        <dt>Arranque</dt><dd>No empieza de cero: parte de la red de PPO y hace 8 vueltas de 600 partidas de autojuego con 48 simulaciones por decisión.</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Una decisión, por dentro</h2>
      <p>La red de AlphaZero en una situación real. Primero, lo que diría la red sola; después, cómo la búsqueda va repartiendo simulaciones.</p>
      <div id="l12"></div>
      <div class="controls"><button class="btn secondary" type="button" id="l12new">Otra situación</button></div>
    </div>
    <div class="card">
      <h2>En pseudocódigo</h2>
      <div class="code">búsqueda (en cada decisión, N simulaciones):
    repartir las cartas ocultas al azar
    bajar por el árbol: en cada nodo, el que juega elige
        argmax  Q_jugador(a) + c · prior(a) · √(disponible(a)) / (1 + N(a))
    en un nodo nuevo: priors y valores de todos con la red
    sumar los valores de cada jugador en el camino
    jugar la más visitada

entrenamiento (cada vuelta):
    600 partidas de autojuego → (estado, visitas, quién ganó)
    política ← entropía cruzada con las visitas
    valor    ← error cuadrático con el resultado</div>
    </div>
    <div class="card">
      <h2>Cómo le fue</h2>
      <p>Con búsqueda, AlphaZero es el mejor agente que aprende del ranking de CuBirds, unos 30 a 40 puntos de Elo arriba de PPO y LSTD. Sólo lo supera el Estratega, un bot escrito a mano copiando lo que hacen AlphaZero y PPO, más un truco que ninguna red aprendió del todo: cerrar la ronda (lección 1). La red sola, sin buscar, juega un poco peor que PPO: aprendió a imitar visitas de una búsqueda corta y con ruido, que es una política más "repartida". Lo que se gana es que <b>red y búsqueda juntas</b> juegan mejor que cualquiera de las dos por separado.</p>
      <p class="muted">En Toma 6 costó más: al principio su búsqueda jugaba peor que la red sola, porque allá el valor (los toros que faltan en la ronda) tiene muchísima varianza y la primera red de valor miraba sólo el promedio de las cartas de la mano. Con una red de valor que mira carta por carta y 256 simulaciones, la búsqueda pasó a sumar más de un toro por ronda y quedó primera.</p>
      <div class="elos" data-elos="az:alphazero:48,red:alphazero,red:ppo,ismcts"></div>
    </div>
    <div class="next">
      <a class="btn secondary" href="arena.html">Ver el ranking completo</a>
      <a class="btn" href="./">Jugar contra AlphaZero</a>
    </div>`;
  async function show() {
    const m = await model('alphazero'), ep = situation(81), g = ep.g, legal = g.legalActions(), hand = ep.hand();
    const net = E.prepNet(m), [, prior] = E.priors(net, g), vals = E.netValues(net, g);
    const rng = seed(83), budgets = [8, 48, 120];
    const runs = budgets.map(it => ({ it, s: E.azSearch(m, g, it, rng) }));
    const order = orderBy(legal.length, i => prior[i]).slice(0, 6);
    const last = runs[runs.length - 1].s;
    for (const i of orderBy(legal.length, i => last.visits[i]).slice(0, 3)) if (!order.includes(i)) order.push(i);
    $('l12').innerHTML = `${situationHTML(ep)}
      <p>La red estima la probabilidad de ganar de cada uno: ${vals.map((v, p) => `${NAMES[p]} <b>${fmt(v * 100, 0)}%</b>`).join(' · ')}.</p>
      <div class="scroll"><table class="dec"><thead><tr><th>Jugada</th><th>Red</th>${budgets.map(b => `<th>${b} sim.</th>`).join('')}</tr></thead><tbody>
      ${order.map(i => `<tr class="${last.visits[i] === Math.max(...last.visits) ? 'best' : ''}"><td>${actHTML(legal[i], hand)}</td><td class="num">${fmt(prior[i] * 100, 1)}%</td>${runs.map(r => `<td class="num">${r.s.visits[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p>Con pocas simulaciones la búsqueda sigue casi al pie de la letra a la red. Con más, las jugadas que en las manos imaginadas salen mejor de lo que la red esperaba juntan visitas, y a veces la favorita cambia. Esas visitas son lo que la red aprende a imitar en la vuelta siguiente: <b>la búsqueda le enseña a la red</b>.</p>`;
  }
  $('l12new').addEventListener('click', () => { $('l12').innerHTML = '<p class="muted">Pensando…</p>'; setTimeout(() => show().catch(() => {}), 20); });
  $('l12').innerHTML = '<p class="muted">Cargando la red…</p>';
  show().catch(() => { $('l12').innerHTML = '<p class="muted">No se pudo cargar el modelo de AlphaZero.</p>'; });
}
